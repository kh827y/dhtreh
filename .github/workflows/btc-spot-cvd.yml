name: BTC spot CVD (staging)
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
concurrency:
  group: btc-spot-cvd-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r btc-spot-cvd/requirements.txt
      - name: Unit tests
        run: cd btc-spot-cvd && python -m unittest discover -s tests -v
      - name: Collect free spot trades
        run: python btc-spot-cvd/collector.py
      - name: Save checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add btc-spot-cvd/data/state.json btc-spot-cvd/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update verified BTC spot CVD checkpoint"
            git push
          fi
